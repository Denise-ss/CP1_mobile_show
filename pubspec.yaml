
name: projeto_cont_fiap
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and/or --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts of
# the product version while build-number is used as the suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade dependencies to newer versions, consider running
# flutter pub upgrade --major-versions.
# To see which dependencies have newer versions, run flutter pub outdated.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Pacote para formatar data e hora
  intl: ^0.20.3

  # Pacote para deslizar os itens da lista
  flutter_slidable: ^4.0.3

  # Pacote para utilizar fontes do Google
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Pacote com recomendacoes de boas praticas do Flutter
  flutter_lints: ^6.0.0

  # Pacote para gerar o icone personalizado
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  # Imagens originais utilizadas no aplicativo CREED
  assets:
    - assets/img/logo_bg.png
    - assets/img/creed_bg.png

  # To add more image assets, add them to the assets section.
  # An image asset can refer to resolution-specific variants.
  # For details:
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts, add a fonts section here.
  # Each entry should have a family name and a list of font assets.
  #
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

# Configuracao do Launcher Icon - CP2
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo_bg.png"
  min_sdk_android: 21
